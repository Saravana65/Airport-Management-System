# ==============================================================================
# Airport Management System - Multi-Tier Docker Compose Orchestration
# Services:
#   1. frontend      - React 18 SPA served via Nginx Reverse Proxy (Port 80)
#   2. backend       - Node.js Express Gateway & C99 Algorithm Engine (Port 5000)
#   3. java-service  - Java 17 OOP Domain Microservice (Port 5050)
# Database:
#   Oracle XE is connected via host.docker.internal:1521/XEPDB1
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Service 1: Java 17 OOP Domain Microservice
  # Handles ticket transactions, dynamic pricing strategies, and state machine
  # ----------------------------------------------------------------------------
  java-service:
    build:
      context: .
      dockerfile: java-service/Dockerfile
    container_name: airport-java-service
    restart: unless-stopped
    ports:
      - "${JAVA_PORT:-5050}:5050"
    networks:
      - airport-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s

  # ----------------------------------------------------------------------------
  # Service 2: Node.js Express Gateway & Native C Algorithm Engine
  # REST API, JWT Authentication, RBAC, and C99 child-process algorithms
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: airport-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - API_PREFIX=/api
      - CORS_ORIGIN=http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173
      - JWT_SECRET=${JWT_SECRET:-airport_production_jwt_secret_phase10}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - COOKIE_SECRET=${COOKIE_SECRET:-airport_production_cookie_secret_phase10}
      - DB_USER=${DB_USER:-airport_admin}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_CONNECT_STRING=${DB_CONNECT_STRING:-host.docker.internal:1521/XEPDB1}
      - DB_POOL_MIN=${DB_POOL_MIN:-2}
      - DB_POOL_MAX=${DB_POOL_MAX:-10}
      - DB_POOL_INCREMENT=${DB_POOL_INCREMENT:-2}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-60}
      - AADE_INTERVAL_MS=${AADE_INTERVAL_MS:-60000}
      - JAVA_SERVICE_URL=http://java-service:5050
      - C_ENGINE_PATH=/app/c-engine/c-engine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      java-service:
        condition: service_healthy
    networks:
      - airport-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 15s

  # ----------------------------------------------------------------------------
  # Service 3: React.js Frontend Presentation Tier
  # Production Single Page App served via Nginx with reverse proxy to backend
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: airport-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - airport-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    stop_grace_period: 10s

# ------------------------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  airport-network:
    name: airport-network
    driver: bridge
